name: Offline engineering checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 20
    env:
      RUN_LIVE_LLM_TESTS: '0'
      TMPDIR: /private/tmp
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'
      - run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.lock
          .venv/bin/python -m pip install --no-deps --no-build-isolation -e .
      - run: .venv/bin/python scripts/generate_protocol.py --check
      - run: .venv/bin/python scripts/check.py --integration
      - run: git diff --exit-code -- src/lqcd_agent/_build_manifest.json
