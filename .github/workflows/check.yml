name: Offline engineering checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 20
    env:
      RUN_LIVE_LLM_TESTS: '0'
      TMPDIR: /private/tmp
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'
      - run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r requirements.lock
          .venv/bin/python -m pip install --no-deps --no-build-isolation -e .
      - run: |
          .venv/bin/uv pip compile pyproject.toml --extra dev --group build --python-version 3.12 --universal --generate-hashes --output-file requirements.lock
          git diff --exit-code -- requirements.lock
          .venv/bin/uv pip check
          .venv/bin/ruff check src tests scripts setup.py
      - run: .venv/bin/python scripts/check.py --integration
      - run: git diff --exit-code -- src/lqcd_agent/_build_manifest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: offline-check-outcomes
          path: |
            check-results/ci-summary.json
            check-results/ci-junit.xml
          retention-days: 7
          if-no-files-found: warn
  linux-static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUN_LIVE_LLM_TESTS: '0'
      TMPDIR: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'
      - run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r requirements.lock
          .venv/bin/python -m pip install --no-deps --no-build-isolation -e .
      - run: |
          .venv/bin/ruff check src tests scripts setup.py
          .venv/bin/python scripts/generate_protocol.py --check
          .venv/bin/python scripts/build_manifest.py --check
          .venv/bin/python -m lqcd_agent.benchmark
          .venv/bin/python -c 'from setuptools.build_meta import build_wheel; build_wheel("dist")'
