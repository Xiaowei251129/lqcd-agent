[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lqcd-agent"
version = "0.2.0"
description = "An AI Research Partner for LQCD with controlled execution and attributable scientific results."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "PyYAML>=6,<7",
    "openai==3.39.0",
    "openai-codex==0.163.0",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

[project.scripts]
lqcd-agent = "lqcd_agent.cli:main"
lqcd-agent-demo = "lqcd_agent.demo.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"lqcd_agent" = ["_build_manifest.json", "resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = ["integration: actual process and durable workflow checks"]
