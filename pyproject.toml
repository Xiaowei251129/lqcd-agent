[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lqcd-agent"
version = "0.2.0"
description = "An AI Research Partner for LQCD with controlled execution and attributable scientific results."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "PyYAML>=6,<7",
    "openai==3.39.0",
    "openai-agents==0.24.0",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "openai-codex==0.163.0",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "uv==0.11.8", "ruff==0.15.1"]

[dependency-groups]
build = ["setuptools==80.9.0", "wheel==0.45.1"]

[project.scripts]
lqcd-agent = "lqcd_agent.cli:main"
lqcd-agent-workbench = "lqcd_agent.workbench.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"lqcd_agent" = ["_build_manifest.json"]
"lqcd_agent.workbench" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = ["integration: actual process and durable workflow checks"]

[tool.ruff]
target-version = "py312"
extend-exclude = ["src/lqcd_agent/control/_generated_protocol.py"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F401"]
