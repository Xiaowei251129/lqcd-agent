[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lqcd-agent"
version = "0.1.0"
description = "AI-assisted, auditable mock-first LangGraph workflow for LQCD meson DA analysis support."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lqcd_agent.demo = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
